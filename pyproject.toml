[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quisium"
version = "0.1.3"
description = "Production-grade security middleware for LLM calls — prompt injection detection, output validation, and tool-call enforcement."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "llm", "security", "prompt-injection", "jailbreak",
    "openai", "fastapi", "flask", "middleware", "ai-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]

# The core package has zero runtime dependencies — everything is stdlib.
# Install optional extras only for the integrations you actually use.
dependencies = []

[project.optional-dependencies]

# Load security policies from YAML configuration files
yaml = [
    "PyYAML>=6.0",
]

# FastAPI / Starlette ASGI middleware and GuardedRoute dependency
fastapi = [
    "starlette>=0.27",
    "fastapi>=0.100",
]

# Flask WSGI middleware and guard_route decorator
flask = [
    "flask>=2.3",
]

# OpenAI provider adapter (OpenAIProvider class)
openai = [
    "openai>=1.0",
]

# Full JSON Schema validation for tool-call argument checking
# Falls back to a built-in lightweight validator when absent
jsonschema = [
    "jsonschema>=4.0",
]

# All optional integrations in one shot
all = [
    "PyYAML>=6.0",
    "starlette>=0.27",
    "fastapi>=0.100",
    "flask>=2.3",
    "openai>=1.0",
    "jsonschema>=4.0",
]

# Development: test runner, type checker, linter, formatter
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",          # async test client for starlette/fastapi
    "PyYAML>=6.0",
    "starlette>=0.27",
    "fastapi>=0.100",
    "flask>=2.3",
    "openai>=1.0",
    "jsonschema>=4.0",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.urls]
Homepage    = "https://github.com/siphalion/quisium"
Repository  = "https://github.com/siphalion/quisium"
Issues      = "https://github.com/siphalion/quisium/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quisium" = ["py.typed"]

# ─────────────────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
addopts      = "-v --tb=short"

# ─────────────────────────────────────────────────────────────────────────────
# mypy
# ─────────────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version         = "3.9"
strict                 = true
warn_return_any        = true
warn_unused_ignores    = true
disallow_untyped_defs  = true

# Optional integrations are soft dependencies — ignore missing stubs
[[tool.mypy.overrides]]
module                  = ["yaml", "flask.*", "starlette.*", "fastapi.*",
                           "openai.*", "jsonschema.*"]
ignore_missing_imports  = true

# ─────────────────────────────────────────────────────────────────────────────
# ruff (linter + formatter)
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length    = 100
target-version = "py39"
src            = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations (type hints)
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101",  # missing type for self
    "ANN102",  # missing type for cls
    "S101",    # use of assert (fine in tests)
    "ANN401",  # Any is sometimes intentional in generic APIs
    "UP006",   # non-pep585-annotation — codebase deliberately uses typing.Dict/List style
    "UP035",   # deprecated-import — same reason
    "UP037",   # quoted-annotation — same reason
    "UP045",   # non-pep604-annotation-optional — same reason
    "E501",    # line-too-long — a handful of long lines, not worth reflowing
    "ANN201",  # missing-return-type-undocumented-public-function
    "ANN202",  # missing-return-type-private-function
    "C408",    # unnecessary-collection-call
    "S110",    # try-except-pass
    "S112",    # try-except-continue
    "S310",    # suspicious-url-open-usage
    "B027",    # empty-method-without-abstract-decorator
    "B904",    # raise-without-from-inside-except
    "RUF022",  # unsorted-dunder-all — __all__ lists are intentionally grouped by comment headers
]

[tool.ruff.lint.per-file-ignores]
"src/**/test_*.py" = [
    "ANN",   # type annotations not required in tests
    "S",     # security checks relaxed in tests
    "B011",  # assert False is fine in tests
]

[tool.ruff.format]
quote-style              = "double"
indent-style             = "space"
skip-magic-trailing-comma = false